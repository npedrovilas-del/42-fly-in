[project]
name = "fly-in"
version = "0.1.0"
description = "Drone routing simulation (42 School - Fly-in)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "pygame-ce>=2.5",
]

[dependency-groups]
dev = [
    "flake8>=7.0",
    "mypy>=1.10",
]

[tool.mypy]
python_version = "3.10"
exclude = ["\\.venv/"]
